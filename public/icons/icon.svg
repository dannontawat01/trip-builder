<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e6f7f5" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#042f2e" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background with rounded corners (iOS/Android compatible) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Compass Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.25" stroke-dasharray="8 12" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.15" />

  <!-- Directional Markers -->
  <polygon points="256,60 264,80 248,80" fill="#ffffff" opacity="0.6" />
  <polygon points="256,452 264,432 248,432" fill="#ffffff" opacity="0.6" />
  <polygon points="60,256 80,264 80,248" fill="#ffffff" opacity="0.6" />
  <polygon points="452,256 432,264 432,248" fill="#ffffff" opacity="0.6" />

  <!-- Center Paper Airplane / Navigator Glyph -->
  <g filter="url(#shadow)" transform="translate(256, 256) rotate(-15) translate(-256, -256)">
    <!-- Main Paper Plane Shape -->
    <path d="M 130,256 L 382,142 L 268,394 L 230,286 Z" fill="url(#planeGrad)" />
    <!-- Wing Fold Shadow -->
    <path d="M 230,286 L 382,142 L 256,256 Z" fill="#cbd5e1" opacity="0.55" />
    <!-- Center Crease -->
    <line x1="130" y1="256" x2="382" y2="142" stroke="#0f766e" stroke-width="4" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- Small Travel Sparkles -->
  <circle cx="370" cy="120" r="8" fill="#fef08a" />
  <circle cx="150" cy="360" r="6" fill="#fef08a" opacity="0.8" />
</svg>
